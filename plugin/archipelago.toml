[archipelago]
# Set by ap-connect. The plugin reconnects on its own when auto_connect is true.
server = ""
slot = ""
password = ""
auto_connect = true
# Set by ap-debug on/off: the debug panel (F10) for testing.
debug_tools = false
# Experimental repairs while Merchant Access is locked; set with ap-repairs on/off.
repair_only = false
# On-screen banners for items received and checks sent.
notifications = true
# Game sounds with the gold, red and white banners.
banner_sounds = true
# Their volume in percent, 0 to 200 (the game's own loudness). Low by default, since they ignore the game's volume and are jarring louder.
banner_volume = 10
# The always-on checks line; status_position is top-left, top, top-right, bottom-left or bottom-right.
status_line = true
status_position = "top-left"
# Items other players send each other, shown greyed in the chat: mine (none of them), progression or all.
other_sends = "progression"

# The Codex charm that carries your received skills.
codex_item = "cm1"
# UniqueItems record of the Archipelago Codex, added by d2r-ap-setup.
codex_unique = 439
# Affix forced onto the fallback Magic Codex (combined affix id); 0 lets D2R roll one.
codex_prefix = 920
# Properties.txt *Id of oskill.
oskill_property = 265
